name: Web and API checks

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test web, API and internal backend foundation
        run: npm test

      - name: Build PWA
        run: npm run build

      - name: Build Pi API
        run: npm run build:server

      - name: Build internal API and migration tools
        run: npm run build:internal

      - name: Install browser for passkey acceptance tests
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance
        run: npm run test:e2e

      - name: Build opt-in internal PWA
        run: npm run build -- --base /internal/ --outDir dist-internal-web
        env:
          VITE_INTERNAL_API: /api/v1

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore

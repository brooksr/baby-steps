name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'pi-token-broker']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per branch, so a push to the broker branch never cancels a Pages deploy of main.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # Pages only ever ships main; other branches build for the Pi alone.
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SHEET_ID: ${{ vars.VITE_GOOGLE_SHEET_ID }}
          VITE_GOOGLE_CLOUD_PROJECT: ${{ vars.VITE_GOOGLE_CLOUD_PROJECT }}
          VITE_GOOGLE_OAUTH_PUBLISHED: ${{ vars.VITE_GOOGLE_OAUTH_PUBLISHED }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # The same build served from the site root, for the Raspberry Pi. The Pi polls
  # this rolling release and installs each new asset (see the rpi project's
  # scripts/babysteps/), so nothing has to reach into the home network.
  # main publishes "pi-latest"; the token-broker branch publishes "pi-broker",
  # so trying it on the Pi never touches what main ships.
  # The Pi build signs in through the broker it serves at /api/token (one-time
  # sign-in); the broker script rides along as a release asset.
  pi:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PI_TAG: ${{ github.ref_name == 'main' && 'pi-latest' || 'pi-broker' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base /
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SHEET_ID: ${{ vars.VITE_GOOGLE_SHEET_ID }}
          VITE_GOOGLE_CLOUD_PROJECT: ${{ vars.VITE_GOOGLE_CLOUD_PROJECT }}
          VITE_GOOGLE_OAUTH_PUBLISHED: ${{ vars.VITE_GOOGLE_OAUTH_PUBLISHED }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
          VITE_GOOGLE_TOKEN_BROKER: /api/token

      - name: Publish Pi release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"sha\":\"${GITHUB_SHA}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > dist/version.json
          tar -czf babysteps-pi.tar.gz -C dist .
          gh release view "$PI_TAG" >/dev/null 2>&1 \
            || gh release create "$PI_TAG" --prerelease --target "$GITHUB_SHA" --title "Raspberry Pi build (${GITHUB_REF_NAME})" \
                 --notes "Rolling build of ${GITHUB_REF_NAME} for the Raspberry Pi. Replaced on every push."
          gh release upload "$PI_TAG" babysteps-pi.tar.gz server/token-broker.mjs --clobber

  deploy:
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

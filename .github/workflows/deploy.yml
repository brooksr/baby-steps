name: Legacy Pi release

on:
  push:
    branches: ['main']
  workflow_dispatch:

# GitHub Pages is no longer deployed: the app is served from the Pi's internal
# backend (deployment/internal/deploy-pi.sh). Only the opt-in legacy Pi release
# below remains.
permissions:
  contents: read

# Per branch, so one branch's release never cancels another's.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # The same build served from the site root, for the Raspberry Pi. The Pi polls
  # this rolling release and installs each new asset (see the rpi project's
  # scripts/babysteps/), so nothing has to reach into the home network.
  # The Pi build signs in through the broker it serves at /api/token (one-time
  # sign-in); the broker script rides along as a release asset, and so does the
  # events API.
  # Off since the household Pi cut over to the internal backend: its update.sh
  # would swap the root site back to this legacy build. Internal releases go out
  # with deployment/internal/deploy-pi.sh instead. Set the repository variable
  # PUBLISH_LEGACY_PI_RELEASE to 'true' only for a Pi still on the legacy stack.
  pi:
    if: vars.PUBLISH_LEGACY_PI_RELEASE == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PI_TAG: pi-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base /
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SHEET_ID: ${{ vars.VITE_GOOGLE_SHEET_ID }}
          VITE_GOOGLE_CLOUD_PROJECT: ${{ vars.VITE_GOOGLE_CLOUD_PROJECT }}
          VITE_GOOGLE_OAUTH_PUBLISHED: ${{ vars.VITE_GOOGLE_OAUTH_PUBLISHED }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
          VITE_GOOGLE_TOKEN_BROKER: /api/token

      # The events API (POST /api/events, for voice assistants) as one bundled
      # Node module; it rides along on the release like the broker.
      - name: Build events API
        run: npm run build:server

      - name: Publish Pi release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"sha\":\"${GITHUB_SHA}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > dist/version.json
          tar -czf babysteps-pi.tar.gz -C dist .
          gh release view "$PI_TAG" >/dev/null 2>&1 \
            || gh release create "$PI_TAG" --prerelease --target "$GITHUB_SHA" --title "Raspberry Pi build (${GITHUB_REF_NAME})" \
                 --notes "Rolling build of ${GITHUB_REF_NAME} for the Raspberry Pi. Replaced on every push."
          gh release upload "$PI_TAG" babysteps-pi.tar.gz server/token-broker.mjs dist-server/events-api.mjs --clobber

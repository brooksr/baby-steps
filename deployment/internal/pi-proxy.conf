# Included inside the existing BabySteps nginx server (Docker network babysteps).
location /api/v1/ {
    resolver 127.0.0.11 valid=30s;
    set $internal http://babysteps-internal:8790;
    client_max_body_size 1m;
    proxy_pass $internal;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_buffering off;
}
location = /internal { return 302 /internal/; }
location /downloads/ {
    alias /srv/internal/downloads/;
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "no-store";
}
location /internal/ {
    alias /srv/internal/current/;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /internal/index.html;
}
# Upgrade the root worker too: older workers cached authenticated API responses.
location = /sw.js {
    alias /srv/internal/legacy-sw.js;
    add_header Cache-Control "no-cache";
}

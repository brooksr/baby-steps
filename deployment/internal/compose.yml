services:
  internal:
    build:
      context: ../..
      dockerfile: deployment/internal/Dockerfile
    image: babysteps-internal:local
    restart: unless-stopped
    env_file: internal.env
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - babysteps-internal:/var/lib/babysteps
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-file: "3"
        max-size: "5m"
volumes:
  babysteps-internal:
